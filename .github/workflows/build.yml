name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

         
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          cache: true

      - name: Configure
        working-directory: client
        run: cmake --preset windows-msvc
      - name: Create secret.h
        shell: pwsh
        working-directory: client
        run: |
          Copy-Item secrets.h.example secrets.h
      - name: Build
        working-directory: client
        run: cmake --build --preset windows-msvc-release

      - name: Install
        working-directory: client
        run: cmake --install build/windows-msvc --config Release

      - name: Package
        working-directory: client
        run: |
          cpack --config build/windows-msvc/CPackConfig.cmake -C Release
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoDB-windows
          path: client/build/windows-msvc/*.zip
